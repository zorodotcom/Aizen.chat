if(state==="wait"){const w=peers.filter(p=>p.presence.state==="wait").sort((a,b)=>a.peer<b.peer?-1:1);const used=new Set();

if(!b)continue;used.add(a.peer);used.add(b.peer);if(a.peer===tab)return connect(b);if(b.peer===tab)return connect(a)}}

$("ssend").onmousedown=e=>e.preventDefault();$("ssend").onclick=sendS;$("sin").onkeydown=e=>{if(e.key==="Enter")sendS()};

$("add").onclick=()=>{if(state!=="chat")return;send("frq",{to:pid,nick,by:myId});add($("smsgs"),"sys","Friend request sent.");$("add").disabled=true};

y.onclick=()=>{saveFriend(r.by,r.nick);send("fra",{to:r.peer,nick,by:myId});incoming.splice(i,1);renderReqs()};n.onclick=()=>{incoming.splice(i,1);renderReqs()};d.append(y,n);b.append(d)})}
function saveFriend(by,n){if(!by||by===myId||friends.some(f=>f.by===by))return;friends.push({by,nick:n});ls.set("kc_friends",friends);if(!cur)cur=by;renderChips();renderF()}
function online(by){return peers.some(p=>p.presence.by===by&&p.peer!==tab)}

function renderF(){gview("f");const b=$("fmsgs");b.innerHTML="";if(!cur){b.append(el("div","empty","No friends yet. Add someone from a stranger chat."));return}
const f=friends.find(x=>x.by===cur);if(!f)return;(fm[cur]||[]).forEach(m=>m.v?addV(b,m.w,m.v,m.mid):add(b,m.w,m.t,m.mid));if(!online(cur))add(b,"sys",`${f.nick} is offline. Messages reach friends only while they are online.`)}

$("fsend").onclick=sendF;$("fin").onkeydown=e=>{if(e.key==="Enter")sendF()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));

const GS={},LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function win(b){for(const[x,y,z]of LINES)if(b[x]&&b[x]===b[y]&&b[x]===b[z])return b[x];return b.every(Boolean)?"draw":null}

const nm=gname(sc),gn=g.type==="rps"?"Rock Paper Scissors":"XOX",t=el("div"),acts=el("div","g-act");

const gr=el("div","grid");["r","p","s"].forEach(x=>{const c=el("button","cell",E[x]);c.disabled=!!g.pick;if(g.pick===x)c.style.borderColor="var(--brand)";c.onclick=()=>{if(g.pick)return;g.pick=x;gsend(sc,"pk",x);rcheck(g,sc,k);gview(sc)};gr.append(c)});

$("xo").onclick=e=>gmenu(e.currentTarget,"s");$("fxo").onclick=e=>gmenu(e.currentTarget,"f");
// ---- voice messages ----
const vsys=(sc,t)=>add($(sc==="s"?"smsgs":"fmsgs"),"sys",t);
function addV(box,cls,url,mid){const m=el("div","m "+cls),a=el("audio");a.controls=true;a.preload="metadata";a.src=url;m.append(a);
if(mid){m.dataset.mid=mid;m.dataset.scope=box.id==="fmsgs"?"f":"s";bind(m);paint(m)}box.appendChild(m);box.scrollTop=box.scrollHeight}
function vurl(d){if(!okId(d.mid)||typeof d.data!=="string"||d.data.length>220000||!/^[A-Za-z0-9+/=]+$/.test(d.data))return null;
const mime=["audio/webm","audio/mp4","audio/ogg"].includes(d.mime)?d.mime:"audio/webm";
try{const b=atob(d.data),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return URL.createObjectURL(new Blob([u],{type:mime}))}catch(e){return null}}
function setMic(on){["mic","fmic"].forEach(i=>{const b=$(i);b.textContent=on?"⏹":"🎤";b.classList.toggle("rec",on)})}
function sendVoice(sc,blob,type){if(blob.size>150000)return vsys(sc,"Voice note too long.");const fr=new FileReader();
fr.onload=()=>{const data=String(fr.result).split(",")[1]||"",mid=nid(),url=URL.createObjectURL(blob);
if(sc==="s"){if(!(pid&&state==="chat"))return;send("vm",{to:pid,mid,mime:type,data});addV($("smsgs"),"me",url,mid)}
else{if(!cur)return;send("fvm",{toBy:cur,by:myId,mid,mime:type,data});(fm[cur]=fm[cur]||[]).push({w:"me",v:url,mid});renderF()}};fr.readAsDataURL(blob)}
let rec=null,chunks=[],rt=null,rsc=null,rstart=0;
async function toggleRec(sc){if(rec){rec.stop();return}
if(sc==="s"&&state!=="chat")return vsys("s","Connect to a stranger first.");if(sc==="f"&&!cur)return;
if(!navigator.mediaDevices||!window.MediaRecorder)return vsys(sc,"Voice notes are not supported in this browser.");
let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return vsys(sc,"Microphone permission was denied.")}
const mt=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"].find(m=>MediaRecorder.isTypeSupported(m))||"";
const r=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:16000}:{audioBitsPerSecond:16000});rec=r;rsc=sc;chunks=[];rstart=Date.now();
r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
r.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearTimeout(rt);const type=(r.mimeType||mt||"audio/webm").split(";")[0],dur=Date.now()-rstart;rec=null;setMic(false);
if(dur<700)return;sendVoice(rsc,new Blob(chunks,{type}),type)};
r.start();setMic(true);rt=setTimeout(()=>{if(rec)rec.stop()},30000)}
$("mic").onclick=()=>toggleRec("s");$("fmic").onclick=()=>toggleRec("f");
function boot(){
if(SUPABASE_URL.startsWith("PASTE")){add($("smsgs"),"sys","Setup needed: add your Supabase URL and anon key in index.html.");return}
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
ch=sb.channel("kerala-lobby",{config:{presence:{key:tab}}});
ch.on("presence",{event:"sync"},()=>{const s=ch.presenceState();peers=Object.entries(s).map(([k,v])=>({peer:k,presence:v[v.length-1]||{}}));tick()});
ch.on("broadcast",{event:"dm"},({payload:d})=>{if(d.to===tab&&d.from===pid&&state==="chat"&&typeof d.text==="string")add($("smsgs"),"them",d.text.slice(0,500),okId(d.mid))});
ch.on("broadcast",{event:"frq"},({payload:d})=>{if(d.to===tab&&d.by&&!friends.some(f=>f.by===d.by)&&!incoming.some(r=>r.by===d.by)){incoming.push({peer:d.from,by:d.by,nick:String(d.nick||"Someone").slice(0,18)});renderReqs()}});
ch.on("broadcast",{event:"fra"},({payload:d})=>{if(d.to===tab&&d.by){saveFriend(d.by,String(d.nick||"Friend").slice(0,18));add($("smsgs"),"sys",`${String(d.nick||"They").slice(0,18)} accepted your request! 🎉`)}});
ch.on("broadcast",{event:"fdm"},({payload:d})=>{if(d.toBy!==myId||!d.by||typeof d.text!=="string")return;if(!friends.some(x=>x.by===d.by))return;
(fm[d.by]=fm[d.by]||[]).push({w:"them",t:d.text.slice(0,500),mid:okId(d.mid)});if($("p-f").classList.contains("on")&&cur===d.by)renderF();else unread[d.by]=(unread[d.by]||0)+1;renderChips()});
ch.on("broadcast",{event:"rx"},({payload:d})=>{const k=okId(d.mid);if(!k||d.to!==tab||d.from!==pid)return;(R[k]=R[k]||{}).them=EM.includes(d.e)?d.e:null;refresh(k)});
ch.on("broadcast",{event:"frx"},({payload:d})=>{const k=okId(d.mid);if(!k||d.toBy!==myId||!friends.some(f=>f.by===d.by))return;(R[k]=R[k]||{}).them=EM.includes(d.e)?d.e:null;refresh(k)});
ch.on("broadcast",{event:"vm"},({payload:d})=>{if(d.to!==tab||d.from!==pid||state!=="chat")return;const u=vurl(d);if(u)addV($("smsgs"),"them",u,okId(d.mid))});
ch.on("broadcast",{event:"fvm"},({payload:d})=>{if(d.toBy!==myId||!d.by||!friends.some(f=>f.by===d.by))return;const u=vurl(d);if(!u)return;
(fm[d.by]=fm[d.by]||[]).push({w:"them",v:u,mid:okId(d.mid)});if($("p-f").classList.contains("on")&&cur===d.by)renderF();else unread[d.by]=(unread[d.by]||0)+1;renderChips()});
ch.on("broadcast",{event:"xo"},({payload:d})=>{let sc=null;if(d.to===tab&&d.from===pid&&state==="chat")sc="s";else if(d.toBy===myId&&friends.some(f=>f.by===d.by))sc="f";if(!sc)return;
const k=sc==="s"?"s":d.by,g=GS[k],a=d.a,i=d.i;
if(a==="inv"){GS[k]=mk(d.g==="rps"?"rps":"xo","inv_in","O");if(sc==="s")add($("smsgs"),"sys","Invited you to a game 🎮");else if(!($("p-f").classList.contains("on")&&cur===k)){unread[k]=(unread[k]||0)+1;renderChips()}}
else if(a==="acc"&&g&&g.st==="inv_out"){g.st="play"}
else if((a==="dec"||a==="cancel"||a==="close")&&g){delete GS[k]}
else if(a==="mv"&&g&&g.type==="xo"&&g.st==="play"&&g.t!==g.me&&Number.isInteger(i)&&i>=0&&i<9&&!g.b[i]){g.b[i]=g.me==="X"?"O":"X";g.t=g.me;check(g)}
else if(a==="pk"&&g&&g.type==="rps"&&g.st==="play"&&["r","p","s"].includes(i)){if(g.opick)g.nq=i;else g.opick=i;rcheck(g,sc,k)}
else return;
if(sc==="s"||cur===k)gview(sc)});
ch.subscribe(s=>{if(s==="SUBSCRIBED"){live=true;start()}else if(["CHANNEL_ERROR","TIMED_OUT","CLOSED"].includes(s)){live=false;state="idle";status();add($("smsgs"),"sys","Cannot reach the chat server. Check your Supabase URL and key.")}})}
$("go").onclick=()=>{nick=$("nick").value.trim()||"Mallu";dist=$("dist").value;ls.set("kc_nick",nick);ls.set("kc_dist",dist);$("gate").remove();
if(friends.length)cur=friends[0].by;renderChips();renderF();boot()};
status();
</script></body></html>
