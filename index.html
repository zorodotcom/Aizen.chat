<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aizen.app – talk to someone new</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--ink:#14231c;--mute:#6b7d74;--line:#dde6e1;--brand:#0f8a5f;--brand2:#e9a100;--me:#0f8a5f;--meink:#fff;--them:#eaf0ed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1511;--card:#16211c;--ink:#e8f1ec;--mute:#8aa095;--line:#26362f;--them:#223029;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1511;--card:#16211c;--ink:#e8f1ec;--mute:#8aa095;--line:#26362f;--them:#223029;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;height:100%;height:100dvh;margin:auto;display:flex;flex-direction:column;background:var(--card);border-inline:1px solid var(--line)}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:18px}.logo b{color:var(--brand)}.logo i{color:var(--brand2);font-style:normal}
.sp{flex:1}.pill{font-size:12px;color:var(--mute)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:11px;border:0;background:none;color:var(--mute);font:600 14px inherit;font-family:inherit;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.badge{background:var(--brand2);color:#000;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.panel{display:none;flex:1;min-height:0;flex-direction:column}.panel.on{display:flex}
.bar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}.dot.on{background:#22c55e}.dot.wait{background:var(--brand2)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 12px;border-radius:16px;word-wrap:break-word;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--me);color:var(--meink);border-bottom-right-radius:4px}
.m.them{align-self:flex-start;background:var(--them);border-bottom-left-radius:4px}
.m.sys{align-self:center;background:none;color:var(--mute);font-size:12px;text-align:center}
.row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.row input{flex:1}
button.b{border:0;border-radius:12px;padding:10px 16px;font:600 14px inherit;font-family:inherit;background:var(--brand);color:#fff;cursor:pointer}
button.b.alt{background:var(--them);color:var(--ink)}button.b:disabled{opacity:.45;cursor:default}
.acts{display:flex;gap:8px;padding:0 12px 10px}.acts .b{flex:1}
.req{margin:8px 12px 0;padding:10px 12px;border:1px solid var(--brand2);border-radius:12px;display:flex;align-items:center;gap:8px;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line)}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:none;color:var(--ink);font:inherit;cursor:pointer}
.chip.on{border-color:var(--brand);background:var(--them)}
.empty{margin:auto;color:var(--mute);text-align:center;padding:24px}
#gate{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.gc{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.gc h1{margin:0;font-size:24px}.gc p{margin:0;color:var(--mute);font-size:13px}
.m{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.m.has{margin-bottom:12px}
.rx{position:absolute;bottom:-12px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0 6px;font-size:12px;line-height:18px}
.m.me .rx{right:8px}.m.them .rx{left:8px}
#pick{position:fixed;z-index:9;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:5px 8px;box-shadow:0 6px 24px #0003}
#pick button{border:0;background:none;font-size:24px;cursor:pointer;padding:2px 3px;border-radius:50%}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script></head><body>
<div id="gate"><div class="gc">
<h1><span style="color:var(--brand)">Aizen</span><span style="color:var(--brand2)">.app</span></h1>
<p>Meet someone new from Kerala (and beyond). Say ഹായ്, make friends, keep chatting.</p>
<input id="nick" maxlength="18" placeholder="Your nickname">
<select id="dist"></select>
<p>18+ only. Be kind and never share personal details or money with strangers.</p>
<button class="b" id="go">Start chatting</button>
</div></div>
<div id="app">
<header><div class="logo"><b>Aizen</b><i>.app</i></div><div class="sp"></div><div class="pill" id="online"></div></header>
<div class="tabs"><button class="on" data-t="s">Stranger chat</button><button data-t="f">Friends<span class="badge" id="unread" hidden></span></button></div>
<main>
<section class="panel on" id="p-s">
<div class="bar"><span class="dot" id="sdot"></span><span id="stat">Not connected</span></div>
<div id="reqs"></div>
<div class="msgs" id="smsgs"></div>
<div class="acts"><button class="b alt" id="next">Find someone</button><button class="b alt" id="add" disabled>Add friend</button></div>
<div class="row"><input id="sin" placeholder="Waiting for a stranger…" maxlength="500" autocomplete="off" enterkeyhint="send"><button class="b" id="ssend">Send</button></div>
</section>
<section class="panel" id="p-f">
<div class="chips" id="chips"></div>
<div class="msgs" id="fmsgs"><div class="empty">No friends yet. Add someone from a stranger chat.</div></div>
<div class="row"><input id="fin" placeholder="Message your friend…" maxlength="500" disabled><button class="b" id="fsend" disabled>Send</button></div>
</section>
</main></div>
<script>
// ====== 1) PASTE YOUR SUPABASE DETAILS HERE (Project Settings > API) ======
const SUPABASE_URL="https://ctmnwgvnixgwjdkeofbj.supabase.co",SUPABASE_KEY="sb_publishable_ufy9T32KSbTloIPcVRZewg_ftct2r5h";
// ==========================================================================
const $=id=>document.getElementById(id);
const D=["Anywhere","Thiruvananthapuram","Kollam","Pathanamthitta","Alappuzha","Kottayam","Idukki","Ernakulam","Thrissur","Palakkad","Malappuram","Kozhikode","Wayanad","Kannur","Kasaragod"];
$("dist").innerHTML=D.map(d=>`<option>${d}</option>`).join("");
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
$("nick").value=ls.get("kc_nick","");$("dist").value=ls.get("kc_dist","Anywhere");
const tab=Math.random().toString(36).slice(2,10);
let myId=ls.get("kc_uid",null);if(!myId){myId=Math.random().toString(36).slice(2)+Date.now().toString(36);ls.set("kc_uid",myId)}
let live=false,ch=null,nick="",dist="",pdist="",peers=[],P={},state="idle",pid=null,pnick="",mutual=false,avoid=null,pt=null,incoming=[],cur=null;
let friends=ls.get("kc_friends",[]),fm={},unread={};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const setP=p=>{P={...P,...p};if(ch)try{ch.track(P)}catch(e){}};
const send=(t,d)=>{if(ch)try{ch.send({type:"broadcast",event:t,payload:{...d,from:tab}})}catch(e){}};
const EM=["❤️","😂","😮","😢","👍","🔥"],R={};
const nid=()=>Math.random().toString(36).slice(2,12)+Date.now().toString(36);
const okId=x=>typeof x==="string"&&/^[a-z0-9]{6,30}$/.test(x)?x:null;
function paint(m){const r=R[m.dataset.mid]||{};const o=m.querySelector(".rx");if(o)o.remove();const n=(r.me?1:0)+(r.them?1:0);
if(!n){m.classList.remove("has");return}const x=el("span","rx",[...new Set([r.me,r.them].filter(Boolean))].join("")+(n>1?" "+n:""));m.append(x);m.classList.add("has")}
function refresh(mid){document.querySelectorAll("[data-mid]").forEach(m=>{if(m.dataset.mid===mid)paint(m)})}
function react(m,e){const mid=m.dataset.mid,r=R[mid]=R[mid]||{};r.me=r.me===e?null:e;
if(m.dataset.scope==="f"){if(cur)send("frx",{toBy:cur,by:myId,mid,e:r.me})}else if(pid&&state==="chat")send("rx",{to:pid,mid,e:r.me});refresh(mid)}
function closePick(){const o=$("pick");if(o)o.remove()}
function pick(m){closePick();const d=el("div");d.id="pick";EM.forEach(e=>{const b=el("button",null,e);b.onclick=ev=>{ev.stopPropagation();react(m,e);closePick()};d.append(b)});
document.body.append(d);const r=m.getBoundingClientRect(),w=d.offsetWidth;d.style.top=Math.max(8,r.top-52)+"px";d.style.left=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8)+"px"}
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#pick"))closePick()});
function bind(m){let t=null,last=0;const stop=()=>clearTimeout(t);
m.onpointerdown=()=>{stop();t=setTimeout(()=>{t=null;pick(m)},450)};
m.onpointerup=()=>{if(t===null)return;stop();const n=Date.now();if(n-last<320){last=0;react(m,"❤️")}else last=n};
m.onpointerleave=m.onpointercancel=stop;m.oncontextmenu=e=>{e.preventDefault();pick(m)}}
function add(box,cls,text,mid){const m=el("div","m "+cls,text);if(mid&&cls!=="sys"){m.dataset.mid=mid;m.dataset.scope=box.id==="fmsgs"?"f":"s";bind(m);paint(m)}box.appendChild(m);box.scrollTop=box.scrollHeight}
function status(){$("sdot").className="dot"+(state==="chat"?" on":state==="wait"?" wait":"");
$("stat").textContent=state==="chat"?`${pnick} · ${pdist||"Kerala"}`:state==="wait"?`Searching… ${Math.max(peers.length-1,0)} other${peers.length===2?"":"s"} online`:live?"Tap Find someone":"Not connected";
const c=state==="chat";$("sin").placeholder=c?"Type a message…":"Waiting for a stranger…";$("add").disabled=!c;$("next").textContent=state==="idle"?"Find someone":"Next"}
function start(){if(!live){add($("smsgs"),"sys","Not connected yet. Check the Supabase URL and key in index.html.");return}state="wait";pid=null;mutual=false;clearTimeout(pt);setP({nick,dist,state:"wait",partner:null,avoid,by:myId});status();tick()}
function connect(o){pid=o.peer;pnick=String(o.presence.nick||"Stranger").slice(0,18);pdist=String(o.presence.dist||"");state="chat";mutual=false;
$("smsgs").innerHTML="";add($("smsgs"),"sys",`You are chatting with ${pnick}. Say ഹായ്! 👋`);add($("smsgs"),"sys","Tip: double-tap a message for ❤️, hold to react.");setP({state:"chat",partner:o.peer});status();
clearTimeout(pt);pt=setTimeout(()=>{if(state==="chat"&&!mutual){avoid=pid;start()}},6000)}
function end(msg){if(state!=="chat")return;add($("smsgs"),"sys",msg);avoid=pid;pid=null;state="idle";setP({state:"idle",partner:null});status()}
function tick(){
if(state==="wait"){const w=peers.filter(p=>p.presence.state==="wait").sort((a,b)=>a.peer<b.peer?-1:1);const used=new Set();
for(const a of w){if(used.has(a.peer))continue;const b=w.find(x=>x.peer!==a.peer&&!used.has(x.peer)&&a.presence.avoid!==x.peer&&x.presence.avoid!==a.peer);
if(!b)continue;used.add(a.peer);used.add(b.peer);if(a.peer===tab)return connect(b);if(b.peer===tab)return connect(a)}}
if(state==="chat"){const p=peers.find(x=>x.peer===pid);if(!p)return end("Stranger left the chat.");
if(p.presence.partner===tab)mutual=true;else if(mutual)end("Stranger moved on.")}
$("online").textContent=live?`● ${Math.max(peers.length,1)} online`:"";status();renderChips()}
function sendS(){const v=$("sin").value.trim();if(!v)return;if(state!=="chat"){add($("smsgs"),"sys","Not connected to anyone yet. Tap Find someone.");return}const mid=nid();send("dm",{to:pid,text:v,mid});add($("smsgs"),"me",v,mid);$("sin").value="";$("sin").focus()}
$("ssend").onmousedown=e=>e.preventDefault();$("ssend").onclick=sendS;$("sin").onkeydown=e=>{if(e.key==="Enter")sendS()};
$("next").onclick=()=>{if(state==="chat")avoid=pid;start()};
$("add").onclick=()=>{if(state!=="chat")return;send("frq",{to:pid,nick,by:myId});add($("smsgs"),"sys","Friend request sent.");$("add").disabled=true};
function renderReqs(){const b=$("reqs");b.innerHTML="";incoming.forEach((r,i)=>{const d=el("div","req");d.append(el("span",null,`${r.nick} wants to be friends`));d.append(el("span","sp"));
const y=el("button","b","Accept"),n=el("button","b alt","No");
y.onclick=()=>{saveFriend(r.by,r.nick);send("fra",{to:r.peer,nick,by:myId});incoming.splice(i,1);renderReqs()};n.onclick=()=>{incoming.splice(i,1);renderReqs()};d.append(y,n);b.append(d)})}
function saveFriend(by,n){if(!by||by===myId||friends.some(f=>f.by===by))return;friends.push({by,nick:n});ls.set("kc_friends",friends);if(!cur)cur=by;renderChips();renderF()}
function online(by){return peers.some(p=>p.presence.by===by&&p.peer!==tab)}
function renderChips(){const c=$("chips");c.innerHTML="";friends.forEach(f=>{const b=el("button","chip"+(cur===f.by?" on":""));b.append(el("span","dot"+(online(f.by)?" on":"")),el("span",null,f.nick));
if(unread[f.by])b.append(el("span","badge",unread[f.by]));b.onclick=()=>{cur=f.by;unread[f.by]=0;renderChips();renderF()};c.append(b)});
const u=Object.values(unread).reduce((a,b)=>a+b,0);$("unread").hidden=!u;$("unread").textContent=u;$("fin").disabled=$("fsend").disabled=!cur}
function renderF(){const b=$("fmsgs");b.innerHTML="";if(!cur){b.append(el("div","empty","No friends yet. Add someone from a stranger chat."));return}
const f=friends.find(x=>x.by===cur);if(!f)return;(fm[cur]||[]).forEach(m=>add(b,m.w,m.t,m.mid));if(!online(cur))add(b,"sys",`${f.nick} is offline. Messages reach friends only while they are online.`)}
function sendF(){const v=$("fin").value.trim();if(!v||!cur)return;const mid=nid();send("fdm",{toBy:cur,by:myId,nick,text:v,mid});(fm[cur]=fm[cur]||[]).push({w:"me",t:v,mid});$("fin").value="";renderF()}
$("fsend").onclick=sendF;$("fin").onkeydown=e=>{if(e.key==="Enter")sendF()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
$("p-s").classList.toggle("on",b.dataset.t==="s");$("p-f").classList.toggle("on",b.dataset.t==="f");if(b.dataset.t==="f"&&cur){unread[cur]=0;renderChips();renderF()}});
function boot(){
if(SUPABASE_URL.startsWith("PASTE")){add($("smsgs"),"sys","Setup needed: add your Supabase URL and anon key in index.html.");return}
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
ch=sb.channel("kerala-lobby",{config:{presence:{key:tab}}});
ch.on("presence",{event:"sync"},()=>{const s=ch.presenceState();peers=Object.entries(s).map(([k,v])=>({peer:k,presence:v[v.length-1]||{}}));tick()});
ch.on("broadcast",{event:"dm"},({payload:d})=>{if(d.to===tab&&d.from===pid&&state==="chat"&&typeof d.text==="string")add($("smsgs"),"them",d.text.slice(0,500),okId(d.mid))});
ch.on("broadcast",{event:"frq"},({payload:d})=>{if(d.to===tab&&d.by&&!friends.some(f=>f.by===d.by)&&!incoming.some(r=>r.by===d.by)){incoming.push({peer:d.from,by:d.by,nick:String(d.nick||"Someone").slice(0,18)});renderReqs()}});
ch.on("broadcast",{event:"fra"},({payload:d})=>{if(d.to===tab&&d.by){saveFriend(d.by,String(d.nick||"Friend").slice(0,18));add($("smsgs"),"sys",`${String(d.nick||"They").slice(0,18)} accepted your request! 🎉`)}});
ch.on("broadcast",{event:"fdm"},({payload:d})=>{if(d.toBy!==myId||!d.by||typeof d.text!=="string")return;if(!friends.some(x=>x.by===d.by))return;
(fm[d.by]=fm[d.by]||[]).push({w:"them",t:d.text.slice(0,500),mid:okId(d.mid)});if($("p-f").classList.contains("on")&&cur===d.by)renderF();else unread[d.by]=(unread[d.by]||0)+1;renderChips()});
ch.on("broadcast",{event:"rx"},({payload:d})=>{const k=okId(d.mid);if(!k||d.to!==tab||d.from!==pid)return;(R[k]=R[k]||{}).them=EM.includes(d.e)?d.e:null;refresh(k)});
ch.on("broadcast",{event:"frx"},({payload:d})=>{const k=okId(d.mid);if(!k||d.toBy!==myId||!friends.some(f=>f.by===d.by))return;(R[k]=R[k]||{}).them=EM.includes(d.e)?d.e:null;refresh(k)});
ch.subscribe(s=>{if(s==="SUBSCRIBED"){live=true;start()}else if(["CHANNEL_ERROR","TIMED_OUT","CLOSED"].includes(s)){live=false;state="idle";status();add($("smsgs"),"sys","Cannot reach the chat server. Check your Supabase URL and key.")}})}
$("go").onclick=()=>{nick=$("nick").value.trim()||"Mallu";dist=$("dist").value;ls.set("kc_nick",nick);ls.set("kc_dist",dist);$("gate").remove();
if(friends.length)cur=friends[0].by;renderChips();renderF();boot()};
status();
</script></body></html>
